<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Prāna Wellness & Living Community</title>
    <script>
      // Single Page Apps redirect for GitHub Pages
      // When GitHub Pages serves 404 for a deep link like /Prana/about, redirect to /Prana/?p=/about
      var segmentCount = 1;
      var loc = window.location;
      var repoBase = loc.pathname.split('/').slice(0, 1 + segmentCount).join('/');
      var deepPath = loc.pathname.slice(1).split('/').slice(segmentCount).join('/');
      var query = loc.search ? '&q=' + loc.search.slice(1).replace(/&/g, '~and~') : '';
      loc.replace(
        loc.protocol + '//' + loc.host + repoBase + '/?p=/' + deepPath + query + loc.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Prāna Wellness...</p>
  </body>
</html>
